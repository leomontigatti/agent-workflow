name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint the shared skills
        run: python3 -I tests/lint_skills.py
      - name: Prove the lint catches each rule
        run: tests/test_lint.sh

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck, Python syntax and every script's test
        run: tests/run.sh
